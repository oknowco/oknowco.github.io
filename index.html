<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK NOW</title>
<meta name="description" content="Time to play">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#050505">
<meta name="msapplication-TileColor" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OK NOW">
<meta property="og:title" content="OK NOW">
<meta property="og:description" content="Time to play">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oknow.co/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="OK NOW">
<meta name="twitter:description" content="Time to play">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="assets/clouds.jpg" as="image" fetchpriority="high">
<link rel="preload" href="assets/fonts/Redaction_35-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=20260718-2">
</head>
<body class="fallback-active startup-screen island-pending">
  <div class="safari-theme-sampler safari-theme-sampler--top" aria-hidden="true"></div>
  <div class="safari-theme-sampler safari-theme-sampler--bottom" aria-hidden="true"></div>
  <div class="monitor-shell">
    <div class="screen">
      <canvas class="crt-canvas"></canvas>
      <div class="msg">
        <span class="desktop-only">It's OK now to turn off<br>your computer.</span>
        <span class="mobile-only">It's OK now<br>to turn off<br>your device.</span>
      </div>
      <div class="off-title">
        <div class="ok-ident" role="img" aria-label="OK NOW. Time to Play.">
          <div class="ok-ident__vertical-mark">
            <div class="ok-ident__star-ok">
              <div class="ok-ident__figure">
                <img class="ok-ident__star-band ok-ident__star-band--1" src="assets/SVG/Stars.svg" alt="">
                <img class="ok-ident__star-band ok-ident__star-band--2" src="assets/SVG/Stars.svg" alt="">
                <img class="ok-ident__star-band ok-ident__star-band--3" src="assets/SVG/Stars.svg" alt="">
                <img class="ok-ident__star-band ok-ident__star-band--4" src="assets/SVG/Stars.svg" alt="">
                <img class="ok-ident__star-band ok-ident__star-band--5" src="assets/SVG/Stars.svg" alt="">
                <img class="ok-ident__star-band ok-ident__star-band--6" src="assets/SVG/Stars.svg" alt="">
                <img class="ok-ident__star-band ok-ident__star-band--eyes" src="assets/SVG/Stars.svg" alt="">
                <img class="ok-ident__ok" src="assets/SVG/ok.svg" alt="">
              </div>
            </div>
            <div class="ok-ident__now-slot">
              <img class="ok-ident__now" src="assets/SVG/now.svg" alt="">
            </div>
          </div>
          <p class="ok-ident__tagline">Time to Play.</p>
        </div>
      </div>
    </div>
    <div class="dynamic-island" aria-label="Monitor controls">
      <button class="power-btn" id="power-btn" type="button" aria-label="Toggle power">
        <svg class="power-btn-icon" viewBox="0 0 80 60" aria-hidden="true">
          <g class="power-glyph" fill="currentColor">
            <rect x="35" y="0" width="10" height="28"/>
            <rect x="16" y="8" width="10" height="8"/>
            <rect x="54" y="8" width="10" height="8"/>
            <rect x="8" y="16" width="10" height="10"/>
            <rect x="62" y="16" width="10" height="10"/>
            <rect x="0" y="26" width="10" height="18"/>
            <rect x="70" y="26" width="10" height="18"/>
            <rect x="8" y="44" width="10" height="8"/>
            <rect x="62" y="44" width="10" height="8"/>
            <rect x="18" y="52" width="44" height="8"/>
          </g>
        </svg>
      </button>
    </div>
  </div>
<script src="script.js?v=20260716-1" defer></script>
</body>
</html>
