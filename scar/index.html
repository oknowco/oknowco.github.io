<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Scar</title>
  <link rel="preload" href="assets/cagliostro.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=scar-quiet-menu">
  <script type="module" src="scar.js?v=scar-rail-joints"></script>
</head>
<body>
  <main id="screen">
    <div id="frame" data-title-open>
      <canvas id="view" aria-label="First-person three-dimensional view of the Scar House Dam construction site" aria-describedby="view-controls" tabindex="-1" inert></canvas>
      <p id="view-controls" class="visually-hidden">Use WASD to walk and Shift to walk faster. Click and drag, swipe, or use the arrow keys to look. Press V to open the menu.</p>
      <span id="reticle" aria-hidden="true"></span>
      <section id="survey" aria-label="Places, scenes and years" hidden>
        <div class="survey-tabs" role="tablist" aria-label="Explore Scar">
          <button id="places-tab" type="button" role="tab" aria-controls="viewpoints" aria-selected="true"><span>Places</span></button>
          <button id="scenes-tab" type="button" role="tab" aria-controls="story-shots" aria-selected="false" tabindex="-1"><span>Scenes</span></button>
          <button id="years-tab" type="button" role="tab" aria-controls="years" aria-selected="false" tabindex="-1"><span>Years</span></button>
        </div>
        <div class="survey-body">
          <div id="viewpoints" role="tabpanel" aria-labelledby="places-tab">
            <h3 id="moor-heading">Moor and dam</h3>
            <div id="moor-places" class="credit-list" role="group" aria-labelledby="moor-heading"></div>
            <h3 id="village-heading">Village</h3>
            <div id="village-places" class="credit-list" role="group" aria-labelledby="village-heading"></div>
            <h3 id="cinema-heading">Cinema</h3>
            <div id="cinema-places" class="credit-list" role="group" aria-labelledby="cinema-heading"></div>
          </div>
          <div id="story-shots" class="credit-list" role="tabpanel" aria-labelledby="scenes-tab" hidden>
            <button type="button" data-shot="elephant" aria-pressed="false">125,000 years</button>
            <button id="play-eclipse" type="button">Play eclipse here</button>
            <button type="button" data-shot="crane" aria-pressed="false">1927 · The crane</button>
            <button type="button" data-shot="rail-ride" aria-pressed="false">1928 · Train to Scar Village</button>
            <button type="button" data-shot="wall" aria-pressed="false">1933 · The child by the wall</button>
            <button type="button" data-shot="wall-walk" aria-pressed="false">Walk around the child</button>
            <button type="button" data-shot="hill-night" aria-pressed="false">Dead Man’s Hill at night</button>
            <button type="button" data-shot="tunnel-figure" aria-pressed="false">1930 · The tunnel mouth</button>
          </div>
          <div id="years" role="tabpanel" aria-labelledby="years-tab" hidden>
            <div class="credit-list" role="group" aria-label="Construction year">
              <button type="button" data-year="1927" aria-pressed="false">1927</button>
              <button type="button" data-year="1928" aria-pressed="false">1928</button>
              <button type="button" data-year="1930" aria-pressed="true">1930</button>
              <button type="button" data-year="1933" aria-pressed="false">1933</button>
              <button type="button" data-year="1936" aria-pressed="false">1936</button>
            </div>
          </div>
        </div>
      </section>
      <div class="controls" hidden>
        <button id="sound" type="button" aria-label="Sound" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9v6h4l5 4V5L7 9H3Z"/>
            <path class="sound-on" d="M15.5 9a4 4 0 0 1 0 6m2.8-8a7 7 0 0 1 0 10"/>
            <path class="sound-off" d="m16 9 5 6m0-6-5 6"/>
          </svg>
        </button>
        <button id="fullscreen" type="button" aria-label="Enter fullscreen" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="expand" d="M9 4H4v5m11-5h5v5m0 6v5h-5M4 15v5h5"/>
            <path class="contract" d="M4 9h5V4m6 0v5h5m0 6h-5v5m-6 0v-5H4"/>
          </svg>
        </button>
        <button id="survey-toggle" type="button" aria-controls="survey" aria-expanded="false" disabled><span>Menu</span></button>
      </div>
      <section id="title-screen" aria-label="Scar scene testing">
        <p class="title-label">Scene testing</p>
        <h1 class="title-mark"><img src="assets/scar.svg?v=bf0d0d" alt="Scar" width="888" height="319"></h1>
        <div id="loading">
          <p id="load-message" role="status">Loading Scar…</p>
          <progress id="load-progress" class="visually-hidden" aria-label="Scene asset progress"></progress>
          <button id="load-retry" class="title-action" type="button" hidden>Try again</button>
        </div>
        <nav id="title-menu" aria-label="Title menu" hidden>
          <button id="title-sound" class="title-action" type="button" aria-pressed="false"><span aria-hidden="true">1. </span><span>Turn on sound</span></button>
          <button id="title-fullscreen" class="title-action" type="button" aria-pressed="false"><span aria-hidden="true">2. </span><span>Go full screen</span></button>
          <button id="play" class="title-action" type="button"><span aria-hidden="true">3. </span><span>Play</span></button>
          <p id="title-feedback" role="status" hidden></p>
        </nav>
        <noscript><p class="title-feedback">Enable JavaScript to play Scar.</p></noscript>
      </section>
      <p id="status" role="status" hidden></p>
      <p id="film-loading" role="status" data-loading hidden></p>
      <p id="control-status" class="visually-hidden" role="status"></p>
    </div>
  </main>
</body>
</html>
